name: TEMPORARY - Test HF auth (no deploy)

# Workflow temporaire de validation.
#
# Objectif : vérifier que l'authentification par header
# (http.<host>.extraheader) fonctionne réellement contre huggingface.co,
# et pas seulement en simulation locale.
#
# Ce workflow NE DÉPLOIE RIEN : il ne fait aucun push, aucune écriture.
# Il se limite à `git ls-remote`, qui est une opération de lecture seule.
#
# À SUPPRIMER une fois la validation faite :
#   git rm .github/workflows/test-hf-auth.yml

on:
  workflow_dispatch:

jobs:
  test-auth:
    runs-on: ubuntu-latest

    steps:
      - name: Verify HF authentication (read-only, no push)
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          set -euo pipefail

          if [ -z "${HF_TOKEN:-}" ]; then
            echo "FAIL: the HF_TOKEN secret is empty or not exposed to this workflow."
            exit 1
          fi
          echo "HF_TOKEN secret is present (value masked by GitHub)."

          # Exactement la même méthode d'authentification que le job de déploiement
          AUTH_HEADER=$(printf 'user:%s' "$HF_TOKEN" | base64 -w0)
          echo "::add-mask::$AUTH_HEADER"

          cleanup() {
            git config --global --unset-all http.https://huggingface.co/.extraheader || true
          }
          trap cleanup EXIT

          git config --global http.https://huggingface.co/.extraheader \
            "Authorization: Basic ${AUTH_HEADER}"

          echo ""
          echo "--- Contacting huggingface.co (read-only) ---"

          # ls-remote lit les refs distantes : authentifie sans rien modifier.
          if git ls-remote "https://huggingface.co/spaces/raniaamil/deepguard-api" > refs.txt 2>err.txt; then
            echo "SUCCESS: authenticated against the Space and read its refs."
            echo ""
            echo "Remote refs:"
            cat refs.txt
          else
            echo "FAIL: could not authenticate or read the Space."
            echo ""
            echo "git stderr:"
            cat err.txt
            exit 1
          fi

      - name: Confirm the token never lands in a repo config
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          set -euo pipefail

          # Reproduit la préparation du dépôt de déploiement, sans pousser,
          # pour vérifier que l'URL du remote ne contient pas le token.
          mkdir -p auth_check && cd auth_check
          git init -q
          git remote add hf "https://huggingface.co/spaces/raniaamil/deepguard-api"

          echo "Remote URL as stored:"
          git remote get-url hf

          if grep -q "${HF_TOKEN}" .git/config; then
            echo "FAIL: the raw token is present in .git/config"
            exit 1
          fi
          echo "OK: the raw token is absent from .git/config"

          if grep -qi "extraheader" .git/config; then
            echo "FAIL: an extraheader was written into the repository config"
            exit 1
          fi
          echo "OK: no extraheader in the repository config (stored globally instead)"
